<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Rota Hava Durumu</title>
  </head>
  <body>
    <aside id="panel">
      <h1>Rota Hava Durumu</h1>
      <ol id="stops"></ol>
      <div class="actions">
        <button type="button" id="add-via">+ Ara durak</button>
        <button type="button" id="locate">Konumumu kullan</button>
      </div>
      <p class="hint">Adres arayın ya da haritaya tıklayarak nokta ekleyin.</p>
      <form id="settings">
        <label class="field">Araç <select id="vehicle"></select></label>
        <fieldset>
          <legend>Hız</legend>
          <div class="choice">
            <label><input type="radio" name="speed-mode" value="average" checked /> Ortalama</label>
            <label><input type="radio" name="speed-mode" value="road" /> Yol tipine göre</label>
          </div>
          <div id="speed-average">
            <label class="field">Ortalama hız <span><input type="number" id="kmh-average" step="1" /> km/s</span></label>
          </div>
          <div id="speed-road" hidden>
            <label class="field">Otoyol <span><input type="number" id="kmh-motorway" step="1" /> km/s</span></label>
            <label class="field">Ana yol <span><input type="number" id="kmh-primary" step="1" /> km/s</span></label>
            <label class="field">Şehir içi <span><input type="number" id="kmh-urban" step="1" /> km/s</span></label>
            <p class="hint">Yol tipi OSRM verisinden tahmin edilir.</p>
          </div>
        </fieldset>
        <fieldset>
          <legend>Çıkış</legend>
          <div class="choice">
            <label><input type="radio" name="depart" value="now" checked /> Şimdi</label>
            <label><input type="radio" name="depart" value="at" /> Tarih/saat</label>
          </div>
          <input type="datetime-local" id="depart-at" aria-label="Çıkış tarihi ve saati" hidden />
        </fieldset>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <ul id="routes"></ul>
      <section id="summary" aria-live="polite"></section>
      <section id="breaks-panel">
        <h2>Molalar</h2>
        <p class="hint">Seçili rotaya tıklayarak mola ekleyin, işaretini sürükleyerek taşıyın.</p>
        <ol id="breaks"></ol>
        <form id="auto-breaks">
          <span>Her</span>
          <input type="number" id="auto-every" min="1" step="1" required aria-label="Otomatik mola aralığı" />
          <select id="auto-unit" aria-label="Aralık birimi">
            <option value="km">km'de</option>
            <option value="min">dk sürüşte</option>
          </select>
          <span class="nowrap"
            ><input type="number" id="auto-duration" list="break-presets" required aria-label="Otomatik mola süresi (dk)" /> dk mola</span
          >
          <button type="submit">Otomatik mola ekle</button>
        </form>
        <datalist id="break-presets"></datalist>
      </section>
    </aside>
    <main id="map" aria-label="Harita"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
